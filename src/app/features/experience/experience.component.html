<section id="experience" class="experience">
  <div class="container">
    <div class="section-header" appScrollReveal>
      <h2 class="section-title">{{ 'EXPERIENCE.TITLE' | translate }}</h2>
      <div class="section-subtitle">{{ 'PROJECTS.SUBTITLE' | translate }}</div>
      <div class="header-line"></div>
    </div>

    <div class="timeline-wrapper">
      <div class="experience-card" *ngFor="let exp of experienceData; let i = index" appScrollReveal [appScrollRevealDelay]="i * 100">
        <div class="timeline-date">
          <span class="date-badge">{{ exp.durationKey | translate }}</span>
        </div>

        <div class="timeline-marker">
          <div class="dot"></div>
        </div>

        <article class="card-content">
          <h3 class="role">{{ exp.titleKey | translate }}</h3>
          <p class="company-name"><i class="fas fa-building"></i> {{ exp.company }}</p>

          <div class="card-body">
            <ul class="task-list" *ngIf="exp.responsibilities">
              <li *ngFor="let resp of exp.responsibilities">{{ resp | translate }}</li>
            </ul>
          </div>
        </article>
      </div>
    </div>
  </div>
</section>
